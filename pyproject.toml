[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-auditor"
version = "1.1.0"
description = "Infrastructure compliance and security auditor"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tommie Seals"}
]
keywords = ["infrastructure", "compliance", "security", "audit", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "ruff>=0.1.0", "mypy>=1.0"]

[project.scripts]
infra-auditor = "infra_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/tommieseals/infra-auditor"
Repository = "https://github.com/tommieseals/infra-auditor"

[tool.setuptools.packages.find]
include = ["infra_auditor*"]
